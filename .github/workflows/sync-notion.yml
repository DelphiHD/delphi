name: Sync Notion to Supabase

# Mirrors Kaycee's HD source library from Notion into the Supabase chunks
# table. Runs nightly so the report engine has fresh content; can also be
# triggered manually via the GitHub UI (Actions → Run workflow) or
# `gh workflow run sync-notion.yml`.
#
# Why GitHub Actions and not Vercel Cron? The Notion walk takes ~10 minutes
# (Notion's 3-req/s rate limit × the four-level traversal for HD The Line
# Companion). Vercel Hobby functions cap at 60 seconds; GH Actions is
# 6 hours. See DECISIONS.md for the architecture choice.

on:
  schedule:
    # 5:30 UTC nightly. Master plan reserves 5:50 UTC for the Phase 4 cache
    # warmer; we run 20 minutes earlier so the warmer hits fresh chunks.
    - cron: "30 5 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sync-notion
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/sync-notion.ts
