name: Daily Transit Report

# Kaycee, 2026-09-28: "Can we move the transit report process off my mac now?"
# and "I'd like it to run automatically at a specific time every morning."
#
# It used to run from a LaunchAgent on her Mac, which meant the report only
# existed if the machine was awake and its copy of the code was current. Neither
# held: the nightly pull had been failing for nine days and the report was
# running from nine-day-old code.
#
# Why GitHub Actions and not Vercel Cron: the run takes about eighteen minutes
# (a cast per phase of the day, then the grounded syntheses). Vercel caps a
# function long before that. Same reasoning as the Notion sync.

on:
  schedule:
    # Six in the morning, Mountain, all year. GitHub only speaks UTC and does
    # not know about daylight saving, so both hours fire and the one that is not
    # 6 AM in Denver stops at the first step.
    - cron: "0 12 * * *"   # 6 AM MDT, summer
    - cron: "0 13 * * *"   # 6 AM MST, winter
    - cron: "0 17 * * *"   # a catch-up, in case the scheduler is hours late
  workflow_dispatch:
    inputs:
      date:
        description: "A day to (re)build, YYYY-MM-DD. Blank means today."
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: transit-report
      cancel-in-progress: false
    steps:
      # GitHub's scheduler is not punctual: on 09-29 and 09-30 it fired these
      # crons around six hours late, at midday in Denver, and the old guard
      # (which insisted the clock said six) threw both days away. So the
      # question is no longer what time it is, it is whether today's report
      # exists yet. Late is fine. Twice is not.
      - name: Which day is this?
        id: when
        run: |
          DAY=$(TZ=America/Denver date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            DAY="${{ inputs.date }}"
          fi
          echo "date=$DAY" >> "$GITHUB_OUTPUT"
          echo "Working on $DAY (Denver)."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # Already there? Then this is the second schedule of the day, or a rerun,
      # and there is nothing to do.
      - name: Is today's report already up?
        id: done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if npx tsx scripts/publish-transit.ts --check "${{ steps.when.outputs.date }}"; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "${{ steps.when.outputs.date }} is already published. Nothing to do."
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
          fi

      # The report grounds itself in her library from .cache/chunks.json, which
      # exists on her Mac and nowhere else. A runner starts bare, so it is
      # written from the database first.
      - name: Bring her library down
        if: steps.done.outputs.already == 'no'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/cache-library.ts

      - name: Write the report
        if: steps.done.outputs.already == 'no'
        env:
          TRANSIT_DATE: ${{ steps.when.outputs.date }}
          TRANSIT_OUT_DIR: ${{ github.workspace }}/out
          MYBODYGRAPH_API_KEY: ${{ secrets.MYBODYGRAPH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/transit-report.ts

      - name: Publish it
        if: steps.done.outputs.already == 'no'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/publish-transit.ts --date "${{ steps.when.outputs.date }}" --dir "${{ github.workspace }}/out"

      # Every client's own read, filed so their chart shows it without being
      # rebuilt. This used to live in run-transit-report.sh, the wrapper the
      # LaunchAgent ran, and was simply left behind when the job moved here on
      # 09-28: the reports kept coming, the charts' transit view did not move.
      # Kaycee, 2026-10-03: "I never said to stop publishing the syntheses."
      #
      # Runs even when the report was already published, because this pass may
      # be the first since the push last worked, and --catch-up files any other
      # published day that never got its reads. The push is idempotent.
      - name: File every client's read
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/push-transit-reads.ts --from-storage --catch-up --date "${{ steps.when.outputs.date }}"

      # The report says so itself when something came out thin, and that has to
      # be visible rather than buried in a log nobody opens.
      - name: Keep the run's own verdict
        if: steps.done.outputs.already == 'no'
        uses: actions/upload-artifact@v4
        with:
          name: transit-${{ steps.when.outputs.date }}
          path: ${{ github.workspace }}/out
          retention-days: 14
